#
# Lucky 二进制行为探测（临时诊断用，确认后可删）
#

name: Lucky行为探测
on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  probe:
    name: 探测 Lucky 3.5.0 / 3.8.1 启动模型
    runs-on: ubuntu-22.04
    steps:
    - name: 下载并探测
      run: |
        cd /tmp
        echo "======== 下载 3.5.0 (GitHub) ========"
        curl -sL --max-time 120 "https://github.com/gdy666/lucky/releases/download/v3.5.0/lucky_3.5.0_Linux_x86_64.tar.gz" -o l350.tgz
        mkdir -p d350 && tar -xzf l350.tgz -C d350 && chmod +x d350/lucky
        echo "======== 下载 3.8.1 (官网文件站) ========"
        curl -sL --max-time 180 "https://release.66666.host/v3.8.1/3.8.1_lucky/lucky_3.8.1_Linux_x86_64.tar.gz" -o l381.tgz
        mkdir -p d381 && tar -xzf l381.tgz -C d381 && chmod +x d381/lucky
        ls -la d350/lucky d381/lucky

        for v in d350 d381; do
          echo "============================================================"
          echo "############## 探测 $v ##############"
          echo "---- [-h 帮助(找 flag 定义)] ----"
          timeout 10 ./$v/lucky -h 2>&1 | head -80
          echo "EXIT=$?"
          echo "---- [-cd /tmp/probe_$v 是否可用] ----"
          mkdir -p /tmp/probe_$v
          timeout 8 ./$v/lucky -cd /tmp/probe_$v 2>&1 | head -30
          echo "EXIT=$?"
          echo "---- [-info -cd] ----"
          timeout 8 ./$v/lucky -info -cd /tmp/probe_$v 2>&1 | head -40
          echo "EXIT=$?"
          echo "---- [-c conf 模式(无预置 conf)] ----"
          timeout 8 ./$v/lucky -c /tmp/probe_$v/lucky.conf 2>&1 | head -40
          echo "EXIT=$?"
          echo "---- [-setconf -key AdminWebListenPort -value 16601 -cd] ----"
          timeout 8 ./$v/lucky -setconf -key AdminWebListenPort -value 16601 -cd /tmp/probe_$v 2>&1 | head -20
          echo "EXIT=$?"
          echo "---- 运行后目录内容 ----"
          ls -la /tmp/probe_$v/ | head -20
        done

        echo "======== checksums.txt (3.8.1 官网) ========"
        curl -sL --max-time 30 "https://release.66666.host/v3.8.1/3.8.1_lucky/checksums.txt" | head -20
